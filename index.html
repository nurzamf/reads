<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nurzam’s Library — Personal Book Catalogue &amp; Reading Journal</title>
    <meta
      name="description"
      content="A personal library documenting books read, books to read, literary interests, and an ongoing reading journey."
    />
    <meta property="og:title" content="Nurzam’s Library" />
    <meta
      property="og:description"
      content="A personal library documenting books read, books to read, literary interests, and an ongoing reading journey."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#3155E7" />

    <link rel="icon" type="image/svg+xml" href="./assets/images/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/components.css" />
    <link rel="stylesheet" href="./assets/css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header" id="site-header">
      <div class="container header-inner">
        <a href="#/" class="brand-link" aria-label="Nurzam’s Library home">
          <img
            src="./assets/images/logo.svg"
            alt=""
            width="36"
            height="36"
            class="brand-logo"
          />
          <span class="brand-name">Nurzam’s Library</span>
        </a>

        <nav class="primary-nav" aria-label="Main navigation">
          <a href="#/" class="nav-link" data-route="home">Library</a>
          <a href="#/to-read" class="nav-link" data-route="to-read">To Read</a>
          <a href="#/read" class="nav-link" data-route="read">Read</a>
          <a href="#/wishlist" class="nav-link" data-route="wishlist">Wishlist</a>
          <a href="#/genres" class="nav-link" data-route="genres">Genres</a>
          <a href="#/authors" class="nav-link" data-route="authors">Authors</a>
          <a href="#/history" class="nav-link" data-route="history">History</a>
        </nav>

        <div class="header-actions">
          <a
            href="#/search"
            class="neo-btn neo-btn-yellow header-search-btn"
            data-route="search"
            aria-label="Search library"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
          </a>

          <button
            type="button"
            class="mobile-menu-toggle"
            id="mobile-menu-toggle"
            aria-expanded="false"
            aria-controls="mobile-nav-drawer"
            aria-label="Open navigation menu"
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <div
        id="mobile-nav-drawer"
        class="mobile-nav-drawer"
        hidden
        aria-label="Mobile navigation"
      >
        <div class="container mobile-nav-list">
          <a href="#/" class="mobile-nav-link" data-route="home">Library</a>
          <a href="#/to-read" class="mobile-nav-link" data-route="to-read">To Read</a>
          <a href="#/read" class="mobile-nav-link" data-route="read">Read</a>
          <a href="#/wishlist" class="mobile-nav-link" data-route="wishlist">Wishlist</a>
          <a href="#/genres" class="mobile-nav-link" data-route="genres">Genres</a>
          <a href="#/authors" class="mobile-nav-link" data-route="authors">Authors</a>
          <a href="#/history" class="mobile-nav-link" data-route="history">History</a>
          <a href="#/search" class="mobile-nav-link" data-route="search">Search</a>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content" tabindex="-1">
      <div class="container">
        <div class="loading-state" role="status" aria-live="polite">
          <div class="loading-card neo-card">
            <p class="loading-title">Opening Nurzam’s Library…</p>
            <p class="loading-subtitle">Loading catalogue and reading statistics.</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer" id="site-footer">
      <div class="container footer-inner">
        <div class="footer-pills" aria-label="External links">
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="footer-pill-btn"
          >
            Instagram
          </a>
          <a
            href="https://www.goodreads.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="footer-pill-btn"
          >
            Goodreads
          </a>
        </div>
        <p class="footer-meta" id="footer-sync-meta">Nurzam’s Library · Notion snapshot</p>
      </div>
    </footer>

    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
